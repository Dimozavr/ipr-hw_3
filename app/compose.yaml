services:
  app:
    build: .
    ports:
      - "${PORT}:8000"
    environment:
      PORT: "8000"
      GREETING: "${GREETING}"
      STORAGE: "redis"
      REDIS_URL: "redis://redis:6379/0"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      timeout: 5s
      interval: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    volumes:
      - data_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      interval: 5s
      retries: 3
volumes:
  data_redis: